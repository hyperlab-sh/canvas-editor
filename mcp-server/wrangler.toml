# The remote MCP endpoint: https://mcp.openflowkit.com/mcp (src/worker.ts).
# Deploy: npm run deploy:remote (builds the data and agent bundle first).
name = "openflowkit-mcp"
main = "src/worker.ts"
compatibility_date = "2026-03-18"
compatibility_flags = ["nodejs_compat"]

routes = [{ pattern = "mcp.openflowkit.com", custom_domain = true }]
workers_dev = false

# The viewer card is imported as a string.
rules = [{ type = "Text", globs = ["**/*.html"], fallthrough = true }]

# grammar.md, icons.json and icon-art/*.json, read by the Worker only: run_worker_first keeps them off the public URL.
[assets]
directory = "./data"
binding = "ASSETS"
run_worker_first = true

[vars]
APP_ORIGIN = "https://app.openflowkit.com"
ALLOWED_HOSTS = "mcp.openflowkit.com,localhost,127.0.0.1"

# A render has a 15 s deadline; ELK cannot be pre-empted, so the CPU limit is the hard stop.
[limits]
cpu_ms = 20000

[observability]
enabled = true
