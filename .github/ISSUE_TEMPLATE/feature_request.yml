name: Feature request
description: Suggest something OpenFlowKit should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job, not the solution. "I keep redrawing our service map after every deploy" beats "add a refresh button".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
