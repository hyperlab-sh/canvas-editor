name: Bug report
description: Something in the app, the MCP server or the CLI does the wrong thing.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the code panel (⌥C)
        2. Paste the text below and press ⌘↵
        3. …
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Diagram text, if any
      description: The smallest OpenFlow DSL, Mermaid, D2 or Structurizr text that shows the bug.
      render: text
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - app.openflowkit.com
        - Local checkout (npm run dev)
        - Self-hosted (Docker)
        - MCP server / agent
        - openflowkit CLI or PR Action
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit SHA for a checkout, or the `openflowkit` version (`npx openflowkit --version`) for the MCP server and CLI.
  - type: input
    id: environment
    attributes:
      label: Browser, OS and GPU
      description: The canvas is WebGL, so the GPU (or "none / software") matters for drawing bugs.
      placeholder: Chrome 141, macOS 15, Apple M2
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or console output
      description: Drag images in. Errors from the browser console (F12) help a lot.
